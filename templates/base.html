{% load static %}

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">

<title>Log in | Safarnameh</title>

<script>
try {
    var m = localStorage.getItem('sf-mode') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

    document.documentElement.dataset.mode = m;
} catch(e) {
    document.documentElement.dataset.mode = 'light';
}
</script>

<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<!-- Main Content -->
{% block main %}

{% endblock %}
<!-- Main Content End -->


<!-- Footer Start -->
<div class="container-fluid bg-dark text-secondary mt-5 pt-5">

    <div class="row px-xl-5 pt-5">

        <div class="col-lg-4 col-md-12 mb-5">

            <h5 class="text-secondary text-uppercase mb-4">
                Get In Touch
            </h5>

            <p class="mb-4">
                MultiShop online store.
            </p>

            <p class="mb-2">
                <i class="fa fa-map-marker-alt text-primary mr-3"></i>
                123 Street, New York, USA
            </p>

            <p class="mb-2">
                <i class="fa fa-envelope text-primary mr-3"></i>
                info@example.com
            </p>

            <p class="mb-0">
                <i class="fa fa-phone-alt text-primary mr-3"></i>
                +012 345 67890
            </p>

        </div>

    </div>

    <div class="row border-top mx-xl-5 py-4"
         style="border-color: rgba(256, 256, 256, .1) !important;">

        <div class="col-md-6 px-xl-0">

            <p class="mb-md-0 text-center text-md-left text-secondary">

                &copy;
                <a class="text-primary" href="#">
                    MultiShop
                </a>

                All Rights Reserved.

            </p>

        </div>

    </div>

</div>
<!-- Footer End -->


<a href="#" class="btn btn-primary back-to-top">
    <i class="fa fa-angle-double-up"></i>
</a>


<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>

<script src="{% static 'lib/easing/easing.min.js' %}"></script>
<script src="{% static 'lib/owlcarousel/owl.carousel.min.js' %}"></script>

<script src="{% static 'js/main.js' %}"></script>

</body>
</html>
